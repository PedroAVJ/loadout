interface:
  display_name: "Oracle"
  short_description: "Ask GPT-5.6 Pro and Fable 5 independently"
  icon_small: "./assets/oracle-icon.svg"
  icon_large: "./assets/oracle-icon.svg"
  brand_color: "#0EA37F"
  default_prompt: "When asked to use Oracle, first gather verified local context and create one focused prompt. Send that same prompt independently to both required lanes: (1) the user's logged-in ChatGPT Pro session through the Chrome plugin, with the visible Intelligence control set to Pro and re-verified before sending, which currently selects GPT-5.6 Sol Pro; and (2) the authenticated Claude Code CLI with --model claude-fable-5, CLAUDE_CODE_NO_MODEL_FALLBACK=1, no effort override, restricted tools, JSON output, and no session persistence, verifying that modelUsage contains claude-fable-5 and no disallowed model output. Do not use the fable alias for substantive prompts. Wait for both answers. Do not expose either answer to the other model, do not silently substitute another model, and label a one-lane result partial. Synthesize consensus, disagreements, each model's strongest unique insight, Codex's locally grounded verdict, and the smallest remaining verification steps."
